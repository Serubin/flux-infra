apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 5m
  timeout: 15m
  chart:
    spec:
      chart: longhorn
      version: 1.12.2
      sourceRef:
        kind: HelmRepository
        name: longhorn-charts
        namespace: default
      interval: 5m
  # longhorn-manager refuses to downgrade, so an automatic rollback would crash-loop it.
  install:
    createNamespace: true
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 0
  values:
    networkPolicies:
      # Node's flannel gateway; without this the 1.12.2+ iSCSI (TCP/3260) rule admits any source.
      v1DataEngineInitiatorSourceCIDRs:
        - 10.42.0.1/32
    persistence:
      # Don't set as default until Longhorn is healthy
      defaultClass: false
      defaultClassReplicaCount: 1
      # Retain volumes when PVC is deleted
      reclaimPolicy: Retain
    defaultSettings:
      # Number of replicas for new volumes
      defaultReplicaCount: "1"
      defaultDataPath: /opt/k3s/longhorn
      autoSalvage: true
      allowRecurringJobWhileVolumeDetached: true
      # Disable auto pod deletion on unexpected volume detach.
      # On a single-node cluster, this prevents a race condition where
      # Longhorn instance-manager restarts cause mass volume remounts,
      # and operators like CNPG recreate pods faster than VolumeAttachments
      # can be cleaned up, creating a deadlock.
      autoDeletePodWhenVolumeDetachedUnexpectedly: false
    ingress:
      enabled: false
    longhornUI:
      replicas: 1
