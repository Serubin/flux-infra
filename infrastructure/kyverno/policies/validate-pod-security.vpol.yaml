apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: validate-pod-security-standard
  annotations:
    policies.kyverno.io/title: Validate Pod Security Standards
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/subject: Pod, Namespace
    policies.kyverno.io/description: >-
      This policy validates that Pods meet the Kubernetes Pod Security Standards
      baseline level via the pod-security.kubernetes.io/enforce label. The baseline
      standard prevents known privilege escalations and requires user namespace
      remapping (hostUsers: false).
spec:
  failurePolicy: Fail
  validationActions: [Audit]
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  autogen:
    validatingAdmissionPolicy:
      enabled: false
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "namespaces"]
  variables:
    - name: isPod
      expression: object.kind == 'Pod'
    - name: isNamespace
      expression: object.kind == 'Namespace'
    - name: laceworkExcluded
      expression: >-
        variables.isPod && object.metadata.namespace == 'default' &&
        ((has(object.metadata.name) && object.metadata.name.startsWith('lacework-agent')) ||
         (has(object.metadata.generateName) && object.metadata.generateName.startsWith('lacework-agent')))
  validations:
    - expression: >-
        !variables.isPod || variables.laceworkExcluded ||
        !has(object.spec.hostUsers) || object.spec.hostUsers == false
      message: >-
        Pods must not use host user namespaces. Set spec.hostUsers to false
        or remove it (it will be automatically added by the mutate-host-users policy).
    - expression: >-
        !variables.isNamespace ||
        (has(object.metadata.labels) &&
         'pod-security.kubernetes.io/enforce' in object.metadata.labels &&
         object.metadata.labels['pod-security.kubernetes.io/enforce'] in ['baseline', 'restricted'])
      message: >-
        Namespaces should have the pod-security.kubernetes.io/enforce label
        set to 'baseline' or 'restricted' to enforce Pod Security Standards.
