apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: mutate-host-users
  annotations:
    policies.kyverno.io/title: Add hostUsers false to Pods
    policies.kyverno.io/category: Security, Multi-Tenancy
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      This policy automatically adds `hostUsers: false` to all Pod specs to ensure
      Kubernetes user namespaces are remapped to unprivileged users on the host.
      This prevents container processes from having the same UIDs as host processes,
      improving security isolation.
spec:
  failurePolicy: Fail
  reinvocationPolicy: Never
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
    mutateExisting:
      enabled: false
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["longhorn-system"]
  matchConditions:
    # Pods are often created with only generateName set, so both fields are checked.
    - name: exclude-default-name-prefixes
      expression: >-
        !(object.metadata.namespace == 'default' &&
          ['lacework-agent', 'kube-prometheus-stack-prometheus-node-exporter-'].exists(p,
            (has(object.metadata.name) && object.metadata.name.startsWith(p)) ||
            (has(object.metadata.generateName) && object.metadata.generateName.startsWith(p))))
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              hostUsers: false
            }
          }
