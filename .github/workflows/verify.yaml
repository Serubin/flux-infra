name: Verify Manifests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["*"]
    tags-ignore: ["*"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check for changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            project:
              - "apps/**"
              - "charts/**"
              - "clusters/**"
              - "configs/**"
              - "infrastructure/**"
              - "scripts/**"
      - name: Setup yq
        if: ${{ steps.filter.outputs.project == 'true' }}
        uses: fluxcd/pkg/actions/yq@main
      - name: Setup kubeconform
        if: ${{ steps.filter.outputs.project == 'true' }}
        uses: fluxcd/pkg/actions/kubeconform@main
      - name: Setup kustomize
        if: ${{ steps.filter.outputs.project == 'true' }}
        uses: fluxcd/pkg/actions/kustomize@main
      - name: Validate manifests
        if: ${{ steps.filter.outputs.project == 'true' }}
        run: ./scripts/verify.sh
      - name: Check authentik brand CSS hash
        if: ${{ steps.filter.outputs.project == 'true' }}
        run: |
          dir=apps/prod/authentik/blueprints/brand
          want=$(sha256sum "$dir/custom.css" | cut -c1-16)
          got=$(yq e '.metadata.labels.css-sha256' "$dir/brand.yaml")
          if [ "$want" != "$got" ]; then
            echo "::error file=$dir/brand.yaml::css-sha256 is $got, custom.css hashes to $want"
            exit 1
          fi
