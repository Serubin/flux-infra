apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: kutt-stripprefix
  namespace: default
spec:
  stripPrefix:
    prefixes:
      - /s
---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: kutt-shortlinks
  namespace: default
spec:
  routes:
    # PathPrefix is a raw string prefix in Traefik v2, not a path-segment match, so
    # `/s` would also swallow /styles/*, /some-page, and every other path beginning
    # with an "s". Match the /s segment explicitly instead.
    - match: Host(`serub.in`) && (Path(`/s`) || PathPrefix(`/s/`))
      kind: Rule
      services:
        - name: kutt
          port: 80
      middlewares:
        - name: kutt-stripprefix
