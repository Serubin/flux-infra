# Only changedetection may use the residential exit, and the proxy pod may only
# reach the WireGuard endpoint (dynamic home IP, hence any address) and kube-dns.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: watcher-vpn
  namespace: default
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: watcher-vpn
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: changedetection
      ports:
        - protocol: TCP
          port: 8888
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: UDP
          port: 51820
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
