apiVersion: v1
kind: ConfigMap
metadata:
  name: wg-easy-blueprint
  namespace: default
data:
  wg-easy.yaml: |
    version: 1
    metadata:
      name: wg-easy-oauth
    entries:
      # wg-easy rejects email_verified=false, which authentik's default mapping always sends; emails here are admin-set.
      - model: authentik_providers_oauth2.scopemapping
        id: wg-easy-email-scope
        identifiers:
          name: "wg-easy OAuth Mapping: OpenID 'email' (verified)"
        attrs:
          scope_name: email
          description: Email address
          expression: |
            return {
                "email": request.user.email,
                "email_verified": True,
            }

      # OIDC provider for the wg-easy v15 admin UI on the NAS.
      # wg-easy links users by email, so access is gated by the Ops binding.
      - model: authentik_providers_oauth2.oauth2provider
        id: wg-easy-provider
        identifiers:
          client_id: wg-easy
        attrs:
          name: wg-easy OAuth Provider
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          # Defaults to empty on create, which rejects every grant.
          grant_types:
            - authorization_code
            - refresh_token
          client_id: wg-easy
          client_secret: !Env WG_EASY_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://wg.serubin.me/api/auth/oidc/callback
            - matching_mode: strict
              url: https://wg.serubin.me/api/auth/oidc/link
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
            - !KeyOf wg-easy-email-scope
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]

      - model: authentik_core.application
        id: wg-easy-app
        identifiers:
          slug: wg-easy
        attrs:
          name: WireGuard
          slug: wg-easy
          provider: !KeyOf wg-easy-provider
          meta_launch_url: https://wg.serubin.me
          icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/wireguard.svg
          meta_description: wg-easy VPN admin
          group: Ops
          open_in_new_tab: true
          policy_engine_mode: any
