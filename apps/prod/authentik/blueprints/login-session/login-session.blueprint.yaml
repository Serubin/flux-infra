apiVersion: v1
kind: ConfigMap
metadata:
  name: login-session-blueprint
  namespace: default
data:
  login-session.yaml: |
    version: 1
    metadata:
      name: login-session-remember-me
    entries:
      # Patches the login stage owned by upstream's default authentication flow, which sets no attrs on it.
      - model: authentik_stages_user_login.userloginstage
        identifiers:
          name: default-authentication-login
        attrs:
          session_duration: seconds=0
          remember_me_offset: days=90
      # Inline password field; upstream's password-stage policy then skips the separate password page.
      - model: authentik_stages_identification.identificationstage
        identifiers:
          name: default-authentication-identification
        attrs:
          user_fields: [email, username]
          password_stage: !Find [authentik_stages_password.passwordstage, [name, default-authentication-password]]
