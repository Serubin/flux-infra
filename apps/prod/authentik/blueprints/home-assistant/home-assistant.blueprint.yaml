apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-blueprint
  namespace: default
data:
  home-assistant.yaml: |
    version: 1
    metadata:
      name: home-assistant-oauth
    entries:
      # OIDC provider for the hass-oidc-auth integration on the NAS.
      # hass-oidc-auth reads the groups claim from the ID token, so claims must stay in it.
      - model: authentik_providers_oauth2.oauth2provider
        id: home-assistant-provider
        identifiers:
          client_id: home-assistant
        attrs:
          name: Home Assistant OAuth Provider
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: home-assistant
          client_secret: !Env HOME_ASSISTANT_CLIENT_SECRET
          include_claims_in_id_token: true
          redirect_uris:
            - matching_mode: strict
              url: https://ha.serubin.me/auth/oidc/callback
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "email"]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]

      - model: authentik_core.application
        id: home-assistant-app
        identifiers:
          slug: home-assistant
        attrs:
          name: Home Assistant
          slug: home-assistant
          provider: !KeyOf home-assistant-provider
          meta_launch_url: https://ha.serubin.me
          icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/home-assistant.svg
          meta_description: Home automation
          group: Apps
          open_in_new_tab: true
          policy_engine_mode: any
