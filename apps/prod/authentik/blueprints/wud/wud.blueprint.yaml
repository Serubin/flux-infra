apiVersion: v1
kind: ConfigMap
metadata:
  name: wud-blueprint
  namespace: default
data:
  wud.yaml: |
    version: 1
    metadata:
      name: wud-oauth
    entries:
      # OIDC provider for What's Up Docker on the NAS (auth name AUTHENTIK).
      # WUD 8.x does no authorization of its own, so the Ops binding is the only gate.
      - model: authentik_providers_oauth2.oauth2provider
        id: wud-provider
        identifiers:
          client_id: wud
        attrs:
          name: WUD OAuth Provider
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: wud
          client_secret: !Env WUD_CLIENT_SECRET
          include_claims_in_id_token: true
          redirect_uris:
            - matching_mode: strict
              url: https://wud.serubin.me/auth/oidc/authentik/cb
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "email"]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]

      - model: authentik_core.application
        id: wud-app
        identifiers:
          slug: wud
        attrs:
          name: What's Up Docker
          slug: wud
          provider: !KeyOf wud-provider
          meta_launch_url: https://wud.serubin.me
          icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/wud.svg
          meta_description: Container update monitoring
          group: Ops
          open_in_new_tab: true
          policy_engine_mode: any
