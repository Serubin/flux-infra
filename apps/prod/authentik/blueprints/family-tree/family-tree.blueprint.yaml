apiVersion: v1
kind: ConfigMap
metadata:
  name: family-tree-blueprint
  namespace: default
data:
  family-tree.yaml: |
    version: 1
    metadata:
      name: family-tree-forward-auth
    entries:
      # Sign-in only: roles and tree access live in the site's own database.
      - model: authentik_providers_oauth2.oauth2provider
        id: family-tree-oidc-provider
        identifiers:
          client_id: family-tree
        attrs:
          name: Family Tree OAuth Provider
          authorization_flow: !Find [authentik_flows.flow, [slug, provider-authorization]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, provider-invalidation]]
          client_type: confidential
          # Defaults to empty on create, which rejects every grant.
          grant_types:
            - authorization_code
            - refresh_token
          # The site refreshes before every save to re-check the sign-in; this matches its session limit.
          refresh_token_validity: hours=8
          client_id: family-tree
          client_secret: !Env FAMILY_TREE_CLIENT_SECRET
          include_claims_in_id_token: true
          sub_mode: hashed_user_id
          redirect_uris:
            - matching_mode: strict
              url: https://family.serub.in/auth/callback
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-offline_access"]]
      - model: authentik_core.application
        id: family-tree-oidc-app
        identifiers:
          slug: family-tree-oidc
        attrs:
          name: Family Tree
          slug: family-tree-oidc
          provider: !KeyOf family-tree-oidc-provider
          meta_launch_url: https://family.serub.in
          open_in_new_tab: true
          group: Family
          policy_engine_mode: any
      # created, not present, so membership edited in the UI survives re-apply.
      - model: authentik_core.group
        id: family-tree-group
        state: created
        identifiers:
          name: family-tree
        attrs:
          is_superuser: false
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf family-tree-oidc-app
          group: !KeyOf family-tree-group
          order: 0
        attrs:
          enabled: true
      # Bindings on these apps and groups are deleted with them.
      - model: authentik_core.application
        state: absent
        identifiers:
          slug: family-tree
      - model: authentik_providers_proxy.proxyprovider
        state: absent
        identifiers:
          name: family-tree-forward-auth
      - model: authentik_core.group
        state: absent
        identifiers:
          name: "family-tree:family:view"
      - model: authentik_core.group
        state: absent
        identifiers:
          name: "family-tree:family:edit"
      - model: authentik_core.group
        state: absent
        identifiers:
          name: "family-tree:family:admin"
      # Shared family login. No password here: it is set in the UI, and
      # state: created keeps a re-apply from resetting it.
      - model: authentik_core.user
        id: family-tree-user
        state: created
        identifiers:
          username: family-tree
        attrs:
          name: Family Tree
          type: internal
          is_active: true
          groups:
            - !KeyOf family-tree-group
      # Self-service denies now come from the restricted-shared-users group.
      - model: authentik_policies.policybinding
        state: absent
        identifiers:
          target: !Find [authentik_flows.flow, [slug, default-user-settings-flow]]
          user: !KeyOf family-tree-user
          order: 0
      - model: authentik_policies.policybinding
        state: absent
        identifiers:
          target: !Find [authentik_flows.flow, [slug, default-password-change]]
          user: !KeyOf family-tree-user
          order: 0
      - model: authentik_policies.policybinding
        state: absent
        identifiers:
          target: !Find [authentik_flows.flow, [slug, default-authenticator-totp-setup]]
          user: !KeyOf family-tree-user
          order: 0
      - model: authentik_policies.policybinding
        state: absent
        identifiers:
          target: !Find [authentik_flows.flow, [slug, default-authenticator-webauthn-setup]]
          user: !KeyOf family-tree-user
          order: 0
      - model: authentik_policies.policybinding
        state: absent
        identifiers:
          target: !Find [authentik_flows.flow, [slug, default-authenticator-static-setup]]
          user: !KeyOf family-tree-user
          order: 0
