apiVersion: v1
kind: ConfigMap
metadata:
  name: family-tree-blueprint
  namespace: default
data:
  family-tree.yaml: |
    version: 1
    metadata:
      name: family-tree-forward-auth
    entries:
      # external_host MUST be domain-only (no trailing path), as with prometheus.
      - model: authentik_providers_proxy.proxyprovider
        id: family-tree-provider
        identifiers:
          name: family-tree-forward-auth
        attrs:
          name: Family Tree Forward Auth Provider
          external_host: https://family.serub.in
          # Unused in forward_single mode, but the serializer requires a value.
          internal_host: http://localhost
          internal_host_ssl_validation: false
          mode: forward_single
          authorization_flow: !Find [authentik_flows.flow, [slug, provider-authorization]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, provider-invalidation]]
      - model: authentik_core.application
        id: family-tree-app
        identifiers:
          slug: family-tree
        attrs:
          name: Family Tree
          slug: family-tree
          provider: !KeyOf family-tree-provider
          meta_launch_url: https://family.serub.in/
          meta_description: Feierstein – Rubin family tree
          open_in_new_tab: true
          group: Family
          policy_engine_mode: any
      # The site's own sign-in, behind forward auth; it reads roles from the groups claim.
      - model: authentik_providers_oauth2.oauth2provider
        id: family-tree-oidc-provider
        identifiers:
          client_id: family-tree
        attrs:
          name: Family Tree OAuth Provider
          authorization_flow: !Find [authentik_flows.flow, [slug, provider-authorization]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, provider-invalidation]]
          client_type: confidential
          # Defaults to empty on create, which rejects every grant.
          grant_types:
            - authorization_code
            - refresh_token
          # The site refreshes before every save to re-read groups; this matches its session limit.
          refresh_token_validity: hours=8
          client_id: family-tree
          client_secret: !Env FAMILY_TREE_CLIENT_SECRET
          include_claims_in_id_token: true
          sub_mode: hashed_user_id
          redirect_uris:
            - matching_mode: strict
              url: https://family.serub.in/auth/callback
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-offline_access"]]
      # An application has one provider, so sign-in gets its own; blank://blank hides its tile.
      - model: authentik_core.application
        id: family-tree-oidc-app
        identifiers:
          slug: family-tree-oidc
        attrs:
          name: Family Tree sign-in
          slug: family-tree-oidc
          provider: !KeyOf family-tree-oidc-provider
          meta_launch_url: blank://blank
          group: Family
          policy_engine_mode: any
      # created, not present, so membership edited in the UI survives re-apply.
      - model: authentik_core.group
        id: family-tree-group
        state: created
        identifiers:
          name: family-tree
        attrs:
          is_superuser: false
      - model: authentik_core.group
        id: family-tree-view-group
        state: created
        identifiers:
          name: "family-tree:family:view"
        attrs:
          is_superuser: false
          # Applied on create only; later membership changes are made in the UI.
          users:
            - !Find [authentik_core.user, [username, family-tree]]
      - model: authentik_core.group
        id: family-tree-edit-group
        state: created
        identifiers:
          name: "family-tree:family:edit"
        attrs:
          is_superuser: false
      - model: authentik_core.group
        id: family-tree-admin-group
        state: created
        identifiers:
          name: "family-tree:family:admin"
        attrs:
          is_superuser: false
          users:
            - !Find [authentik_core.user, [username, solomon]]
      # Every role group may open both the forward-auth app and sign-in.
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf family-tree-app
          group: !KeyOf family-tree-group
          order: 0
        attrs:
          enabled: true
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf family-tree-app
          group: !KeyOf family-tree-view-group
          order: 1
        attrs:
          enabled: true
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf family-tree-app
          group: !KeyOf family-tree-edit-group
          order: 2
        attrs:
          enabled: true
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf family-tree-app
          group: !KeyOf family-tree-admin-group
          order: 3
        attrs:
          enabled: true
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf family-tree-oidc-app
          group: !KeyOf family-tree-group
          order: 0
        attrs:
          enabled: true
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf family-tree-oidc-app
          group: !KeyOf family-tree-view-group
          order: 1
        attrs:
          enabled: true
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf family-tree-oidc-app
          group: !KeyOf family-tree-edit-group
          order: 2
        attrs:
          enabled: true
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf family-tree-oidc-app
          group: !KeyOf family-tree-admin-group
          order: 3
        attrs:
          enabled: true
      # Shared family login. No password here: it is set in the UI, and
      # state: created keeps a re-apply from resetting it.
      - model: authentik_core.user
        id: family-tree-user
        state: created
        identifiers:
          username: family-tree
        attrs:
          name: Family Tree
          type: internal
          is_active: true
          groups:
            - !KeyOf family-tree-group
      # Self-service denies now come from the restricted-shared-users group.
      - model: authentik_policies.policybinding
        state: absent
        identifiers:
          target: !Find [authentik_flows.flow, [slug, default-user-settings-flow]]
          user: !KeyOf family-tree-user
          order: 0
      - model: authentik_policies.policybinding
        state: absent
        identifiers:
          target: !Find [authentik_flows.flow, [slug, default-password-change]]
          user: !KeyOf family-tree-user
          order: 0
      - model: authentik_policies.policybinding
        state: absent
        identifiers:
          target: !Find [authentik_flows.flow, [slug, default-authenticator-totp-setup]]
          user: !KeyOf family-tree-user
          order: 0
      - model: authentik_policies.policybinding
        state: absent
        identifiers:
          target: !Find [authentik_flows.flow, [slug, default-authenticator-webauthn-setup]]
          user: !KeyOf family-tree-user
          order: 0
      - model: authentik_policies.policybinding
        state: absent
        identifiers:
          target: !Find [authentik_flows.flow, [slug, default-authenticator-static-setup]]
          user: !KeyOf family-tree-user
          order: 0
