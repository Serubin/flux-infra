apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lacework-agent
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: lacework-agent
      version: 8.5.0
      sourceRef:
        kind: HelmRepository
        name: lacework-charts
        namespace: default
  values:
    image:
      registry: docker.io
      repository: lacework/datacollector
      tag: 8.5.0
    datacollector:
      # Not required, but trying to be verbose
      enabled: true
    laceworkConfig:
      serverUrl: https://api.lacework.net
      # Cluster must provide this
      accessToken: ""
      containerEngineEndpoint: unix:///run/k3s/containerd/containerd.sock
      containerRuntime: containerd
      codeaware:
        enable: true
        # CAA's fanotify fds on pod volume mounts make kubelet's umount fail EBUSY, so pods stick Terminating.
        mountignore:
          - /dev
          - /proc
          - /sys
          - /laceworkfim/dev
          - /laceworkfim/proc
          - /laceworkfim/sys
          - /opt/k3s/kubelet/pods
          - /var/lib/kubelet/pods
          - /laceworkfim/opt/k3s/kubelet/pods
