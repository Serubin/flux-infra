kind: Deployment
apiVersion: apps/v1
metadata:
  name: serubin-net
  namespace: default
  labels:
    app: serubin-net
    app.kubernetes.io/name: serubin-net

spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: serubin-net
  template:
    metadata:
      labels:
        app: serubin-net
        app.kubernetes.io/name: serubin-net
    spec:
      containers:
        - name: serubin-net
          image: ghcr.io/serubin/serubin-net:2026.10.30
          ports:
            - name: web
              containerPort: 80
          # Next only listens after the portfolio fetch + cache warm (~90s, GitHub-bound).
          startupProbe:
            httpGet:
              path: /
              port: web
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: web
            periodSeconds: 10
            timeoutSeconds: 5
