# The old file store, frozen since the database imported it; no pod mounts it, and Velero's family-tree-data-final holds a copy.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: family-tree-data
  namespace: default
  annotations:
    # Longhorn deletes the volume with its claim, so a revert or rename must never prune this.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOncePod
  resources:
    requests:
      storage: 1Gi
