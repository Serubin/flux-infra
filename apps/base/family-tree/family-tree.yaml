apiVersion: apps/v1
kind: Deployment
metadata:
  name: family-tree
  namespace: default
  labels:
    app: family-tree
    app.kubernetes.io/name: family-tree
spec:
  replicas: 1
  # The data volume is ReadWriteOncePod, so the old pod must stop before the new one starts.
  strategy:
    type: Recreate
    # Server-side apply keeps the old RollingUpdate defaults unless they are cleared.
    rollingUpdate: null
  selector:
    matchLabels:
      app: family-tree
  template:
    metadata:
      labels:
        app: family-tree
        app.kubernetes.io/name: family-tree
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: family-tree-data
      # Private package: the image bakes in family.ged, which holds living people's addresses.
      imagePullSecrets:
        - name: ghcr-pull-family-tree
      containers:
        - name: family-tree
          image: ghcr.io/serubin/family-tree:2026.10.5@sha256:1cd40209533c21b7a88fdf77a72cd9e0e6f6ac604a5b3ce6c5094b60a43e0bb8
          ports:
            - name: web
              containerPort: 8787
          env:
            # The server refuses 0.0.0.0, so it listens on the pod IP only.
            - name: BIND
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: PORT
              value: "8787"
            # The server checks the TCP peer; Traefik and kubelet probes both come from the pod network.
            - name: ALLOW_CIDRS
              value: 10.42.0.0/16
            - name: ALLOWED_HOSTS
              value: family.serub.in
            # The image seeds an empty volume from /app/seed once; after that the volume is the tree.
            - name: DATA_DIR
              value: /data
            - name: TREE_ID
              value: family
            - name: PUBLIC_URL
              value: https://family.serub.in
            - name: OIDC_ISSUER
              value: https://${OAUTH_URL}/application/o/family-tree-oidc/
            # Discovery, token and key requests stay inside the cluster; the provider still names its public URLs.
            - name: OIDC_BACKCHANNEL
              value: http://authentik-server.default.svc.cluster.local
            - name: OIDC_CLIENT_ID
              value: family-tree
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: family-tree-auth-secrets
                  key: FAMILY_TREE_CLIENT_SECRET
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          # The server answers 421 to any Host but family.serub.in. Readiness waits on OIDC discovery;
          # liveness does not, so an Authentik restart never kills this pod.
          readinessProbe:
            httpGet:
              path: /readyz
              port: web
              httpHeaders:
                - name: Host
                  value: family.serub.in
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: web
              httpHeaders:
                - name: Host
                  value: family.serub.in
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 96Mi
            limits:
              cpu: 200m
              memory: 256Mi
