apiVersion: apps/v1
kind: Deployment
metadata:
  name: family-tree
  namespace: default
  labels:
    app: family-tree
    app.kubernetes.io/name: family-tree
spec:
  replicas: 1
  # The old file store is ReadWriteOncePod, so the old pod must stop before the new one starts.
  strategy:
    type: Recreate
    # Server-side apply keeps the old RollingUpdate defaults unless they are cleared.
    rollingUpdate: null
  selector:
    matchLabels:
      app: family-tree
  template:
    metadata:
      labels:
        app: family-tree
        app.kubernetes.io/name: family-tree
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: family-tree-db
        - name: data
          persistentVolumeClaim:
            claimName: family-tree-data
      # Private package: the image bakes in family.ged, which holds living people's addresses.
      imagePullSecrets:
        - name: ghcr-pull-family-tree
      containers:
        - name: family-tree
          image: ghcr.io/serubin/family-tree:2026.11.3@sha256:317a7b4b7a9e2c4daec0aa3f4f6b5890d4b4064d87ec57ba45eae2a24689ff6a
          ports:
            - name: web
              containerPort: 8787
          env:
            # The server refuses 0.0.0.0, so it listens on the pod IP only.
            - name: BIND
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: PORT
              value: "8787"
            # The server checks the TCP peer; Traefik and kubelet probes both come from the pod network.
            - name: ALLOW_CIDRS
              value: 10.42.0.0/16
            - name: ALLOWED_HOSTS
              value: family.serub.in
            # The database lives in /data; the old file store sits at /data/trees, where an empty database imports it from.
            - name: DATA_DIR
              value: /data
            - name: IMPORT_DIR
              value: /data/trees/family
            - name: TREE_ID
              value: family
            - name: PUBLIC_URL
              value: https://family.serub.in
            - name: OIDC_ISSUER
              value: https://${OAUTH_URL}/application/o/family-tree-oidc/
            # Discovery, token and key requests stay inside the cluster; the provider still names its public URLs.
            - name: OIDC_BACKCHANNEL
              value: http://authentik-server.default.svc.cluster.local
            - name: OIDC_CLIENT_ID
              value: family-tree
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: family-tree-auth-secrets
                  key: FAMILY_TREE_CLIENT_SECRET
            # Seals the login cookie and encrypts stored refresh tokens.
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: family-tree-session
                  key: SESSION_SECRET
            # Turns on /mcp. A vendor document that stops matching its pin blocks new connections until reviewed.
            - name: MCP_CLIENTS
              value: |-
                [
                  {
                    "client_id": "https://claude.ai/oauth/claude-code-client-metadata",
                    "name": "Claude Code",
                    "redirect_uris": ["http://localhost/callback", "http://127.0.0.1/callback"],
                    "stated_auth_method": "none",
                    "auth_method": "none",
                    "jwks_uri": null,
                    "grant_types": ["authorization_code", "refresh_token"],
                    "application_type": "native"
                  },
                  {
                    "client_id": "https://chatgpt.com/oauth/client.json",
                    "name": "ChatGPT",
                    "redirect_uris": ["https://chatgpt.com/connector_platform_oauth_redirect"],
                    "stated_auth_method": "private_key_jwt",
                    "auth_method": "private_key_jwt",
                    "jwks_uri": "https://chatgpt.com/oauth/jwks.json",
                    "grant_types": ["authorization_code", "refresh_token"],
                    "application_type": "web"
                  }
                ]
          volumeMounts:
            - name: db
              mountPath: /data
            - name: data
              mountPath: /data/trees
              subPath: trees
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          # Nothing listens until the first import finishes, so this gives it two minutes before liveness applies.
          startupProbe:
            httpGet:
              path: /livez
              port: web
              httpHeaders:
                - name: Host
                  value: family.serub.in
            periodSeconds: 2
            failureThreshold: 60
          # The server answers 421 to any Host but family.serub.in. Readiness waits on OIDC discovery;
          # liveness does not, so an Authentik restart never kills this pod.
          readinessProbe:
            httpGet:
              path: /readyz
              port: web
              httpHeaders:
                - name: Host
                  value: family.serub.in
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: web
              httpHeaders:
                - name: Host
                  value: family.serub.in
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 96Mi
            limits:
              cpu: 200m
              memory: 256Mi
