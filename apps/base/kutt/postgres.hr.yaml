apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kutt-postgresql-cnpg
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: cluster
      version: 0.9.0
      sourceRef:
        kind: HelmRepository
        name: cloudnativepg-charts
        namespace: default
      interval: 5m
  values:
    name: kutt-postgresql-cnpg
    cluster:
      instances: 1
      imageName: ghcr.io/cloudnative-pg/postgresql:18.7-minimal-trixie@sha256:c8caac9817d2b5e5e66297a3ccf86d9fcbd68f097aa6cc00161d83f9635e88cc
      storage:
        size: 4Gi
        storageClass: longhorn
      monitoring:
        enabled: true
        podMonitor:
          enabled: true
        prometheusRule:
          # cluster chart 0.6.0 ships two rules whose PromQL applies a range
          # selector to an aggregated instant vector (invalid syntax), causing
          # the prometheus-operator admission webhook to reject the whole rule
          # group. Remove once upstream fixes the expressions.
          excludeRules:
            - CNPGClusterLogicalReplicationErrors
            - CNPGClusterLogicalReplicationErrorsCritical
            - CNPGClusterLogicalReplicationStopped
            - CNPGClusterLogicalReplicationStoppedCritical
      initdb:
        database: kutt
        owner: kutt
        # Secret must have 'username' and 'password' keys
